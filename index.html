<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://unpkg.com/htmlincludejs"></script>

    <link rel="stylesheet" href="./assets/styles/index.css"></link>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link 
    rel="preconnect" 
    href="https://fonts.gstatic.com" crossorigin>
<link 
    href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Varta:wght@300..700&display=swap" 
    rel="stylesheet">
    <title>To do list</title>
</head>
<body>
    <div class="home">
        <div class="home-container">
            <div class="text-container">
                <h2>Productivity Hub</h2>
                <h5><span>Efficent planner.</span> Streamline your tasks, maximize productivity. <span>Let us be part of your success.</span></h5>
            </div>
            <div class="form-container">
                <h3>Sign in</h3>
                <form id="login-form">
                    <input 
                        type="text" 
                        id="username" 
                        placeholder="Username"
                        required>
                    <input 
                        type="password" 
                        id="password" 
                        placeholder="Password"
                        required>
                    <button type="submit">Login</button>
                </form>
            </div>
        </div>
    </div>
    <script src="./js/home.js"></script>
</body>
</html>
