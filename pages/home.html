<home class="home">
    <div class="home-container">
        <div class="text-container">
            <h2>Productivity Hub</h2>
            <h5><span>Efficent planner.</span> Streamline your tasks, maximize productivity. <span>Let us be part of your success.</span></h5>
        </div>
        <div class="form-container">
            <h3>Sign in</h3>
            <form id="login-form">
                <input 
                    type="text" 
                    id="username" 
                    placeholder="Username"
                    required>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="Password"
                    required>
                <button type="submit">Login</button>
            </form>
        </div>
    </div>
</home>
