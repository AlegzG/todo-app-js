<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link 
    rel="preconnect" 
    href="https://fonts.gstatic.com" crossorigin>
<link 
    href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Varta:wght@300..700&display=swap" 
    rel="stylesheet">
    <title>To do page</title>
</head>
<body>
    <div class="todo">
        <div class="todo-container">
            <div id="task-container">
                <h2>Tasks list</h2>
                <table id="task-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Created</th>
                            <th>Last update</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        <!-- dinamically added -->
                    </tbody>
                </table>
                <div class="table-btns">
                     <form>
                        <input type="text" id="search"/>
                        <button id="filter-btn">Search</button>
                     </form>
                     <button id="new-task-btn">Add new task</button>
                </div>
            </div>
            <div id="modal">
                <div class="modal-content">
                    <h2>Create new task</h2>
                    <form id="modal-form">
                        <input id="task-title" placeholder="Title" required />
                        <textarea id="task-description" placeholder="Description" required></textarea>
                        <div class="modal-btns">
                            <button id="modal-cancel-btn">Cancel</button>
                            <button id="modal-create-btn" type="button">Create task</button>
                        </div>
                    </form>
                </div>
            </div>
            <div id="edit-modal">
                <div class="modal-content">
                    <h2>Edit your task</h2>
                    <input id="edit-title" placeholder="Title" required />
                    <textarea id="edit-description" placeholder="Description" required></textarea>
                    <div class="modal-btns">
                        <button id="edit-cancel-btn">Cancel</button>
                        <button id="modal-edit-btn" type="button">Edit</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/todo.js"></script>
</body>
</html>
