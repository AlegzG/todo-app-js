<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../assets/styles/index.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link 
    rel="preconnect" 
    href="https://fonts.gstatic.com" crossorigin>
<link 
    href="https://fonts.googleapis.com/css2?family=Raleway:ital,wght@0,100..900;1,100..900&family=Varta:wght@300..700&display=swap" 
    rel="stylesheet">
    <title>To do page</title>
</head>
<body>
    <div class="todo">
        <div class="todo-container">
            <div class="task-container">
                <h2>Tasks list</h2>
                <table id="task-table">
                    <thead>
                        <tr>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Created</th>
                            <th>Last update</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="task-list">
                        <!-- <tr>
                            <td>Dishes</td>
                            <td>Wash dishes</td>
                            <td>03.03.2025.</td>
                            <td>03.03.2025</td>
                            <td>
                                <button>Edit</button>
                                <button>Delete</button>
                            </td>
                        </tr> -->
                    </tbody>
                </table>
                <div class="table-btns">
                    <button id="new-task">Add new task</button>
                    <button id="filter-btn">Filter</button>
                </div>
            </div>
        </div>
    </div>
    <script src="../js/todo.js"></script>
</body>
</html>
